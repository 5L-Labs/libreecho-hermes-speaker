<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="1100" height="780" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Two-way voice: several LibreEcho devices and several Hermes gateways</title>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L8,4L0,8z" fill="#2563eb"/></marker>
    <marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L8,4L0,8z" fill="#16a34a"/></marker>
    <marker id="k" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L8,4L0,8z" fill="#6b7280"/></marker>
    <style>
      text { fill: #111827; font-size: 13px; }
      .s { font-size: 11px; fill: #4b5563; }
      .h { font-size: 12px; font-weight: 600; fill: #374151; }
      .t { font-size: 18px; font-weight: 600; }
      .n { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; }
      .new { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .opt { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .grp { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.2; }
      .in { stroke: #2563eb; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
      .fb { stroke: #9ca3af; stroke-width: 1.5; fill: none; stroke-dasharray: 2 4; }
      .out { stroke: #16a34a; stroke-width: 2; fill: none; }
      .thin { stroke: #9ca3af; stroke-width: 1.2; fill: none; }
    </style>
  </defs>
  <rect width="1100" height="780" fill="#ffffff"/>

  <text class="t" x="20" y="32">Two-way voice: many LibreEchos ↔ many Hermes gateways</text>
  <text class="s" x="20" y="52">Green, solid: runs today (Hermes → Echo). Blue, dashed: planned (Echo → Hermes). Grey, dotted: host fallback. Numbers follow one spoken turn.</text>

  <!-- Echo device -->
  <rect class="grp" x="20" y="70" width="480" height="420" rx="10"/>
  <text class="h" x="34" y="90">Echo A · LibreEcho on an Echo Dot 2nd Gen</text>

  <rect class="box" x="36" y="110" width="200" height="54" rx="6"/>
  <text x="48" y="132">Wake word + VAD</text>
  <text class="s" x="48" y="150">LibreEcho, unchanged</text>

  <rect class="box" x="36" y="210" width="200" height="54" rx="6"/>
  <text x="48" y="232">libreecho-sttd-wyoming</text>
  <text class="s" x="48" y="250">Custom voice mode STT client</text>

  <rect class="box" x="36" y="410" width="200" height="54" rx="6"/>
  <text x="48" y="432">Announcement bus</text>
  <text class="s" x="48" y="450">speaker, ducks music</text>

  <rect class="grp" x="262" y="104" width="226" height="372" rx="8" style="fill:#ffffff"/>
  <text class="h" x="274" y="122">dot-gadget (on the device)</text>

  <rect class="new" x="274" y="132" width="202" height="62" rx="6"/>
  <text x="286" y="153">Speech shim</text>
  <text class="s" x="286" y="170">SenseVoice int8: text + language</text>
  <text class="s" x="286" y="185">speaker embedding: who spoke</text>

  <rect class="new" x="274" y="214" width="202" height="62" rx="6"/>
  <text x="286" y="235">Routing rules</text>
  <text class="s" x="286" y="252">name → speaker → language</text>
  <text class="s" x="286" y="267">→ last used → default</text>

  <rect class="box" x="274" y="296" width="202" height="62" rx="6"/>
  <text x="286" y="317">Gadget sockets × N</text>
  <text class="s" x="286" y="334">one ws:// per Hermes, own key</text>
  <text class="s" x="286" y="349">and device id per upstream</text>

  <rect class="box" x="274" y="400" width="202" height="62" rx="6"/>
  <text x="286" y="421">Playback queue</text>
  <text class="s" x="286" y="438">one clip at a time, arrival order</text>
  <text class="s" x="286" y="453">≤ 600 s per message</text>

  <!-- in-device edges -->
  <path class="in" d="M136,164 V206" marker-end="url(#a)"/>
  <path class="in" d="M236,237 H252 V163 H270" marker-end="url(#a)"/>
  <text class="s" x="48" y="284">utterance PCM, 16 kHz, to the shim</text>
  <path class="in" d="M375,194 V210" marker-end="url(#a)"/>
  <path class="in" d="M375,276 V292" marker-end="url(#a)"/>
  <path class="out" d="M375,358 V396" marker-end="url(#g)"/>
  <text class="s" x="382" y="382">reply PCM</text>
  <path class="out" d="M274,437 H240" marker-end="url(#g)"/>

  <!-- Other Echoes -->
  <rect class="grp" x="20" y="520" width="480" height="76" rx="10"/>
  <text class="h" x="34" y="542">Echo B</text>
  <text class="s" x="34" y="562">Same dot-gadget and shim, its own keys and device ids per Hermes.</text>
  <text class="s" x="34" y="580">More Echoes add rows here; each pairs once per Hermes.</text>
  <rect class="grp" x="20" y="612" width="480" height="40" rx="10" style="stroke-dasharray:5 4"/>
  <text class="s" x="34" y="636">Echo N · any LibreEcho device</text>

  <!-- Host side -->
  <rect class="grp" x="540" y="70" width="540" height="526" rx="10"/>
  <text class="h" x="554" y="90">LAN hosts</text>

  <rect class="opt" x="556" y="110" width="230" height="80" rx="6"/>
  <text x="568" y="132">Oracle Router (fallback)</text>
  <text class="s" x="568" y="150">Whisper + language + speaker ID</text>
  <text class="s" x="568" y="168">used only if the device benchmark</text>
  <text class="s" x="568" y="182">fails or the shim is unsure</text>

  <rect class="box" x="820" y="110" width="244" height="74" rx="6" style="fill:#f0fdf4;stroke:#16a34a"/>
  <text x="832" y="132">Any Hermes starts speech itself</text>
  <text class="s" x="832" y="150">send_message gadget:&lt;id&gt;</text>
  <text class="s" x="832" y="165">gadget_speak, cron, home channel</text>

  <rect class="box" x="820" y="236" width="244" height="80" rx="6"/>
  <text x="832" y="258">hermes-01</text>
  <text class="s" x="832" y="276">gadget plugin · speak_replies</text>
  <text class="s" x="832" y="291">TTS ElevenLabs multilingual</text>
  <text class="s" x="832" y="306">demo: English</text>

  <rect class="box" x="820" y="356" width="244" height="80" rx="6"/>
  <text x="832" y="378">hermes-03</text>
  <text class="s" x="832" y="396">gadget plugin · speak_replies</text>
  <text class="s" x="832" y="411">TTS Kokoro jf_alpha</text>
  <text class="s" x="832" y="426">demo: Japanese</text>

  <rect class="box" x="820" y="476" width="244" height="80" rx="6" style="stroke-dasharray:5 4"/>
  <text x="832" y="498">Any gadget-protocol gateway</text>
  <text class="s" x="832" y="516">another Hermes, here or elsewhere;</text>
  <text class="s" x="832" y="531">speaks gadget proto v1 with</text>
  <text class="s" x="832" y="546">text in and speaker audio out</text>

  <!-- shim <-> fallback -->
  <path class="fb" d="M476,150 H552" marker-end="url(#k)"/>
  <path class="fb" d="M556,172 H480" marker-end="url(#k)"/>
  <text class="s" x="507" y="143">PCM</text>
  <text class="s" x="548" y="206">text, lang, speaker</text>

  <!-- sockets <-> hermes -->
  <path class="in" d="M476,316 H700 V268 H816" marker-end="url(#a)"/>
  <path class="out" d="M820,286 H716 V336 H480" marker-end="url(#g)"/>
  <path class="in" d="M700,316 V388 H816" marker-end="url(#a)"/>
  <path class="out" d="M820,406 H716 V336" />
  <path class="in" d="M700,388 V508 H816" marker-end="url(#a)"/>
  <path class="out" d="M820,526 H716 V406" />
  <text class="s" x="548" y="308">{"type":"text"}</text>
  <text class="s" x="548" y="356">reply PCM, its voice</text>

  <path class="out" d="M942,184 V232" marker-end="url(#g)"/>

  <!-- Other Echoes to every Hermes -->
  <path class="thin" d="M500,558 H760 V300 H816" marker-start="url(#k)" marker-end="url(#k)"/>
  <path class="thin" d="M760,420 H816" marker-end="url(#k)"/>
  <path class="thin" d="M760,540 H816" marker-end="url(#k)"/>
  <path class="thin" d="M500,632 H760 V540"/>
  <text class="s" x="560" y="550">same sockets, both directions</text>

  <!-- step markers -->
  <g>
    <circle cx="26" cy="137" r="9" fill="#2563eb"/><text class="n" x="22.5" y="141">1</text>
    <circle cx="258" cy="200" r="9" fill="#2563eb"/><text class="n" x="254.5" y="204">2</text>
    <circle cx="466" cy="146" r="9" fill="#2563eb"/><text class="n" x="462.5" y="150">3</text>
    <circle cx="390" cy="285" r="9" fill="#2563eb"/><text class="n" x="386.5" y="289">4</text>
    <circle cx="520" cy="316" r="9" fill="#2563eb"/><text class="n" x="516.5" y="320">5</text>
    <circle cx="520" cy="336" r="9" fill="#16a34a"/><text class="n" x="516.5" y="340">6</text>
    <circle cx="257" cy="420" r="9" fill="#16a34a"/><text class="n" x="253.5" y="424">7</text>
  </g>

  <text class="h" x="20" y="684">One spoken turn</text>
  <text class="s" x="20" y="704">1 “Alexa, Hermes three, …” wakes the Echo. 2 LibreEcho sends the utterance to the shim as its STT server. 3 The shim transcribes it on the device:</text>
  <text class="s" x="20" y="722">text, language and speaker (or asks the host fallback). 4 The rules pick hermes-03 from the name. 5 The shim sends the text as a gadget “text” turn on</text>
  <text class="s" x="20" y="740">that socket. 6 hermes-03 answers with its own TTS, streamed down the same socket. 7 The queue plays it.</text>
  <text class="s" x="20" y="758">Hermes-initiated speech (top right) uses steps 6–7 only; that path runs today.</text>
</svg>
