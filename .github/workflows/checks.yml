name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check script syntax
        run: |
          for f in setup.sh dot-gadget/install.sh dot-gadget/run root-ssh/install.sh root-ssh/run; do bash -n "$f"; done
          python3 -m py_compile dot-gadget/hermes_gadget_dot.py
      - name: Voice relay end to end
        run: |
          python3 -m pip install -q websockets==16.0  # what the Dot runs (Alpine py3-websockets)
          python3 tests/test_voice_relay.py
